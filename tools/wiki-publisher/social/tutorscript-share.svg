<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">TutorScript: explicit teaching decisions, AI-generated instruction</title>
  <desc id="desc">A clockwise cycle connects KC and teaching-move selection, instruction, the learner response, and assessment with feedback. A saved maximum-relationship Hamiltonian path orders KCs.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf7fd"/><stop offset="1" stop-color="#eee5f5"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 1 7 4.5 2 8" fill="none" stroke="#716480" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="627" fill="url(#paper)"/>
  <rect width="10" height="627" fill="#102349"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="38" y="66" font-size="21" font-weight="600" letter-spacing="1.2" fill="#6c577e">RULE-GUIDED AI TUTORING</text>
    <text x="33" y="166" font-size="70" font-weight="700" letter-spacing="-2.5" fill="#102349">TutorScript</text>
    <g font-size="36" font-weight="500" fill="#343342">
      <text x="38" y="249">Explicit teaching</text><text x="38" y="292">decisions.</text>
      <text x="38" y="359">AI-generated</text><text x="38" y="402">instruction.</text>
    </g>
    <path d="M38 467h350" stroke="#cbbdd8" stroke-width="2"/>
    <text x="38" y="514" font-size="27" font-weight="650" fill="#102349">MoFaCTS</text>
    <text x="38" y="551" font-size="26" font-weight="500" fill="#102349">Optimal Learning Lab</text>
    <text x="38" y="592" font-size="23" fill="#6c577e">optimallearning.org</text>
    <g fill="none" stroke="#716480" stroke-width="3" marker-end="url(#arrow)">
      <path d="M986 145Q1063 165 1063 214"/>
      <path d="M1063 426Q1050 478 1003 489"/>
      <path d="M647 489Q598 477 598 426"/>
      <path d="M598 214Q603 159 659 145"/>
    </g>
    <g fill="#fff" stroke="#d1c5df" stroke-width="2">
      <rect x="672" y="24" width="308" height="160" rx="20"/>
      <rect x="932" y="228" width="250" height="184" rx="20"/>
      <rect x="660" y="438" width="332" height="169" rx="20"/>
      <rect x="464" y="228" width="266" height="184" rx="20"/>
    </g>
    <g fill="#102349" font-size="30" font-weight="650" text-anchor="middle">
      <text x="826" y="70">1 · Select target</text>
      <text x="1057" y="270">2 · Present</text><text x="1057" y="306">instruction</text>
      <text x="826" y="477">3 · Learner</text><text x="826" y="513">responds</text>
      <text x="597" y="270">4 · Assess and</text><text x="597" y="306">give feedback</text>
    </g>
    <g fill="#343342" font-size="24" text-anchor="middle">
      <text x="826" y="113">KC path, then choose</text><text x="826" y="146">a teaching move</text>
      <text x="1057" y="351">Explanation and</text><text x="1057" y="385">optional support</text>
      <text x="826" y="551">Four response</text><text x="826" y="584">formats</text>
      <text x="597" y="351">Update evidence;</text><text x="597" y="385">continue or stop</text>
    </g>
    <g fill="#6c577e" font-size="27" font-weight="600" text-anchor="middle">
      <text x="832" y="292">Instructional</text><text x="832" y="327">cycle</text>
    </g>
    <text x="832" y="364" fill="#6c577e" font-size="23" text-anchor="middle">continues</text>
  </g>
</svg>
